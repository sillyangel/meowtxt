        <rect width="190" height="42" rx="21" fill="#064e3b" fill-opacity="0.4" stroke="#059669" stroke-width="1.5" stroke-opacity="0.8"/>
        <path d="M24 13 C20 13 18 16 18 19 L18 25 L16 27 L16 28 L32 28 L32 27 L30 25 L30 19 C30 16 28 13 24 13 Z M22 29 C22 30.1 22.9 31 24 31 C25.1 31 26 30.1 26 29 Z" fill="#34d399"/>
        <text x="105" y="26.5" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="600" fill="#34d399">Web Notifications</text>
