      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#060e26"/>
      <stop offset="100%" stop-color="#0d1538"/>
    </linearGradient>

    <!-- Radial Glow Behind Icon -->
    <radialGradient id="iconGlow" cx="19%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#0284c7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <!-- Ambient Right Glow -->
    <radialGradient id="rightGlow" cx="85%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#4338ca" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#1d4ed8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#060e26" stop-opacity="0"/>
    </radialGradient>

    <!-- Ambient Bottom Glow -->
