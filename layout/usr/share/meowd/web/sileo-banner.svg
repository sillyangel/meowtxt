    <path d="M138 190 L152 106 C154 94 168 90 176 99 L232 162 Z" fill="#ffffff"/>
    <path d="M374 190 L360 106 C358 94 344 90 336 99 L280 162 Z" fill="#ffffff"/>
    <path d="M256 144 C162 144 92 200 92 272 C92 312 115 347 152 371 C147 394 132 414 116 424 C112 427 114 433 119 433 C153 432 186 416 207 395 C223 398 239 400 256 400 C350 400 420 344 420 272 C420 200 350 144 256 144 Z" fill="#ffffff"/>
