      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#001f97" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <!-- 1. Background Layers -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#iconGlow)"/>
  <rect width="1200" height="400" fill="url(#rightGlow)"/>
  <rect width="1200" height="400" fill="url(#bottomGlow)"/>

