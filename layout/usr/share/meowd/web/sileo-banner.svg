      <text x="26" y="19" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#7dd3fc" letter-spacing="0.5">ROOTLESS TWEAK</text>

