  <circle cx="1060" cy="70" r="160" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.12" stroke-dasharray="8 8"/>
  <circle cx="1060" cy="70" r="230" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.08"/>

