<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34c8ff"/>
      <stop offset="48%" stop-color="#0a84ff"/>
      <stop offset="100%" stop-color="#5e5ce6"/>
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f2ff"/>
    </linearGradient>
    <filter id="dropShadow" x="-12%" y="-10%" width="124%" height="128%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#041d42" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- iOS Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="108" ry="108" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4"/>

  <!-- Cat-eared iMessage Speech Bubble -->
  <g filter="url(#dropShadow)">
    <!-- Left Cat Ear -->
    <path d="M138 190 L152 106 C154 94 168 90 176 99 L232 162 Z" fill="url(#bubbleGrad)"/>
    <!-- Right Cat Ear -->
    <path d="M374 190 L360 106 C358 94 344 90 336 99 L280 162 Z" fill="url(#bubbleGrad)"/>
    <!-- Inner Pink/Indigo Ear Accents -->
    <path d="M154 172 L163 122 L202 165 Z" fill="#0a84ff" opacity="0.25"/>
    <path d="M358 172 L349 122 L310 165 Z" fill="#5e5ce6" opacity="0.25"/>

    <!-- Main Speech Bubble Body + Tail -->
    <path d="M256 144 C162 144 92 200 92 272 C92 312 115 347 152 371 C147 394 132 414 116 424 C112 427 114 433 119 433 C153 432 186 416 207 395 C223 398 239 400 256 400 C350 400 420 344 420 272 C420 200 350 144 256 144 Z" fill="url(#bubbleGrad)"/>
  </g>

  <!-- Stylized Cat Eyes, Nose & Whiskers inside the Bubble -->
  <circle cx="204" cy="256" r="16" fill="#0f172a"/>
  <circle cx="308" cy="256" r="16" fill="#0f172a"/>
  <circle cx="199" cy="251" r="5" fill="#ffffff"/>
  <circle cx="303" cy="251" r="5" fill="#ffffff"/>

  <!-- Cute Triangle Nose & 'w' Cat Mouth -->
  <path d="M246 276 L266 276 L256 289 Z" fill="#0a84ff"/>
  <path d="M230 296 Q243 310 256 294 Q269 310 282 296" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Whiskers (doubling as typing/message lines) -->
  <line x1="132" y1="268" x2="166" y2="274" stroke="#0a84ff" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
  <line x1="132" y1="292" x2="166" y2="288" stroke="#0a84ff" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
  <line x1="380" y1="268" x2="346" y2="274" stroke="#5e5ce6" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
  <line x1="380" y1="292" x2="346" y2="288" stroke="#5e5ce6" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
</svg>
