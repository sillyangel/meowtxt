name: Build & Publish meowtxt

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: Build Rootless .deb (iOS arm64)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bash curl git perl make \
            fakeroot rsync zip unzip \
            libxml2-utils zstd dpkg

      - name: Install Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
        env:
          THEOS: ${{ runner.temp }}/theos

      - name: Build rootless package
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=rootless TARGET=iphone:clang:latest:15.0 FINALPACKAGE=1
          ls -la packages/
          dpkg-deb -I packages/*.deb
          dpkg-deb -c packages/*.deb
        env:
          THEOS: ${{ runner.temp }}/theos

      - name: Upload Debian package
        uses: actions/upload-artifact@v7
        with:
          name: meowtxt-rootless
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Publish to sileo.sillyangel.dev (via hackclub.app IPv4 Proxy)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository (for Sileo assets)
        uses: actions/checkout@v7

      - name: Download Debian package
        uses: actions/download-artifact@v8
        with:
          name: meowtxt-rootless
          path: packages/

      - name: Deploy to hel1.sillyangel.dev via angel@hackclub.app IPv4 proxy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: hackclub.app
          DEPLOY_USER: angel
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
            echo "::notice::DEPLOY_SSH_KEY secret is not configured yet."
            exit 0
          fi

          mkdir -p ~/.ssh /tmp/meowtxt-stage
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          cat > ~/.ssh/config <<EOF
          Host hackclub-proxy
              HostName ${DEPLOY_HOST}
              User ${DEPLOY_USER}
              IdentityFile ~/.ssh/deploy_key
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
              LogLevel ERROR
          EOF
          chmod 600 ~/.ssh/config

          DEB_FILE=$(ls packages/*.deb | head -1)
          VERSION=$(dpkg-deb -f "$DEB_FILE" Version)
          echo "Deploying dev.sillyangel.meowtxt v${VERSION} (${DEB_FILE})..."

          cp "$DEB_FILE" /tmp/meowtxt-stage/meowtxt.deb
          cp layout/usr/share/meowd/sileo/icon.png /tmp/meowtxt-stage/meowtxt-icon.png
          cp layout/usr/share/meowd/web/sileo-banner.png /tmp/meowtxt-stage/meowtxt-banner.png

          python3 - "$VERSION" <<'PY'
          import json, sys
          version = sys.argv[1]
          index_data = {
              "bundle_id": "dev.sillyangel.meowtxt",
              "name": "meowtxt",
              "version": version,
              "tagline": "On-device iMessage Web, PWA/IWA & REST/SSE API daemon for iOS 15-16",
              "homepage": "https://github.com/sillyangel/meowtxt",
              "developer": {"name": "angel", "email": "angel@sillyangel.dev"},
              "maintainer": {"name": "angel", "email": "angel@sillyangel.dev"},
              "section": "Networking",
              "dependencies": "firmware (>= 15.0), preferenceloader (>= 2.2.3)",
              "provides": "",
              "works_min": "15.0",
              "works_max": "16.9",
              "featured": "true",
              "source": "https://github.com/sillyangel/meowtxt",
              "changelog": [
                  {
                      "version": version,
                      "changes": "Modular ES web client, Web/Push notifications (received, sent, delivered, read), HEIC/Sticker hardware transcoding, Focus/DND Notify Anyway, iOS 16 Edit/Unsend, and native Settings PreferenceLoader bundle.",
                  }
              ],
          }
          with open("/tmp/meowtxt-stage/meowtxt-index.json", "w") as f:
              json.dump(index_data, f, indent=2)
          with open("/tmp/meowtxt-stage/meowtxt-description.md", "w") as f:
              f.write(
                  "meowtxt (dev.sillyangel.meowtxt) is an on-device iMessage Web, PWA / Chrome Isolated Web App (IWA), "
                  "and REST + Server-Sent Events (SSE) API daemon for rootless iOS 15-16 (meowd on port 8737).\n\n"
                  "- Real-Time Web Client: Modular ES-module web UI with two-way synced pinned conversations, contact avatars, live typing indicators, tapbacks, inline replies, and bubble/screen effects.\n"
                  "- Web, Push & Webhook Notifications: Live alerts when iMessages are received, sent, delivered, or read.\n"
                  "- Focus / DND & Notify Anyway: Detects Focus / Do Not Disturb status via StatusKit and supports manual Notify Anyway breakthrough (POST /api/notify).\n"
                  "- Hardware HEIC & Sticker Conversion: Automatically transcodes .heic/.heif photos to JPEG and stickers to PNG on-device.\n"
                  "- Native iOS Settings: Toggle the server on/off and view or copy your access token in Settings -> meowtxt.\n"
              )
          with open("/tmp/meowtxt-stage/deploy-meowtxt.sh", "w") as f:
              f.write("\n".join([
                  "#!/usr/bin/env bash",
                  "set -euo pipefail",
                  "mkdir -p /var/www/sileo/Packages/meowtxt/silica_data/screenshots /var/www/sileo/Packages/meowtxt/silica_data/scripts",
                  "mv /tmp/meowtxt.deb /var/www/sileo/Packages/meowtxt/tweak.deb",
                  "mv /tmp/meowtxt-icon.png /var/www/sileo/Packages/meowtxt/silica_data/icon.png",
                  "mv /tmp/meowtxt-banner.png /var/www/sileo/Packages/meowtxt/silica_data/banner.png",
                  "mv /tmp/meowtxt-index.json /var/www/sileo/Packages/meowtxt/silica_data/index.json",
                  "mv /tmp/meowtxt-description.md /var/www/sileo/Packages/meowtxt/silica_data/description.md",
                  "cd /var/www/sileo",
                  "source venv/bin/activate",
                  "python3 index.py",
                  "rm -f /tmp/deploy-meowtxt.sh /tmp/test_scp",
                  "echo '__MEOWTXT_DEPLOY_OK__'",
                  "",
              ]))
          PY

          tar -czf /tmp/meowtxt-bundle.tar.gz -C /tmp/meowtxt-stage .

          # Stream bundle & execute deploy script in a single SSH connection
          # (hackclub.app SSH proxy closes sessions with -1 / exit 255, so verify via completion marker)
          OUT=$(ssh hackclub-proxy "bash -c 'tar -xzf - -C /tmp && bash /tmp/deploy-meowtxt.sh'" < /tmp/meowtxt-bundle.tar.gz 2>&1 || true)
          echo "$OUT"
          echo "$OUT" | grep -q "__MEOWTXT_DEPLOY_OK__"
          echo "Published dev.sillyangel.meowtxt v${VERSION} to https://sileo.sillyangel.dev"
