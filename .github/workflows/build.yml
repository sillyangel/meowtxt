name: Build & Publish meowtxt

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: Build Rootless .deb (iOS arm64)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bash curl git perl make \
            fakeroot rsync zip unzip \
            libxml2-utils zstd dpkg

      - name: Install Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
        env:
          THEOS: ${{ runner.temp }}/theos

      - name: Build rootless package
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=rootless TARGET=iphone:clang:latest:15.0 FINALPACKAGE=1
          ls -la packages/
          dpkg-deb -I packages/*.deb
          dpkg-deb -c packages/*.deb
        env:
          THEOS: ${{ runner.temp }}/theos

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: meowtxt-rootless
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Publish to sileo.sillyangel.dev (via hackclub.app IPv4 Proxy)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository (for Sileo assets)
        uses: actions/checkout@v5

      - name: Download Debian package
        uses: actions/download-artifact@v4
        with:
          name: meowtxt-rootless
          path: packages/

      - name: Deploy to hel1.sillyangel.dev via angel@hackclub.app IPv4 proxy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          PROXY_HOST: hackclub.app
          PROXY_USER: angel
          TARGET_HOST: hel1.sillyangel.dev
          TARGET_USER: root
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
            echo "::notice::DEPLOY_SSH_KEY secret is not configured yet."
            exit 0
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          cat > ~/.ssh/config <<EOF
          Host hackclub-root
              HostName ${PROXY_HOST}
              User root
              IdentityFile ~/.ssh/deploy_key
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
              LogLevel ERROR

          Host hackclub-proxy
              HostName ${PROXY_HOST}
              User ${PROXY_USER}
              IdentityFile ~/.ssh/deploy_key
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
              LogLevel ERROR

          Host hel1
              HostName ${TARGET_HOST}
              User ${TARGET_USER}
              ProxyJump hackclub-proxy
              IdentityFile ~/.ssh/deploy_key
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
              LogLevel ERROR
          EOF
          chmod 600 ~/.ssh/config

          DEB_FILE=$(ls packages/*.deb | head -1)
          VERSION=$(dpkg-deb -f "$DEB_FILE" Version)
          echo "Deploying dev.sillyangel.meowtxt v${VERSION} (${DEB_FILE})..."

          python3 - "$VERSION" <<'PY'
          import json, sys
          version = sys.argv[1]
          index_data = {
              "bundle_id": "dev.sillyangel.meowtxt",
              "name": "meowtxt",
              "version": version,
              "tagline": "On-device iMessage Web, PWA/IWA & REST/SSE API daemon for iOS 15–16",
              "homepage": "https://sileo.sillyangel.dev",
              "developer": {"name": "angel", "email": "angel@sillyangel.dev"},
              "maintainer": {"name": "angel", "email": "angel@sillyangel.dev"},
              "section": "Networking",
              "dependencies": "firmware (>= 15.0), preferenceloader (>= 2.2.3)",
              "works_min": "15.0",
              "works_max": "16.9",
              "featured": "true",
              "source": "https://github.com/sillyangel/meowtxt",
              "changelog": [
                  {
                      "version": version,
                      "changes": "Modular ES web client, Web/Push notifications (received, sent, delivered, read), HEIC/Sticker hardware transcoding, Focus/DND Notify Anyway, iOS 16 Edit/Unsend, and native Settings PreferenceLoader bundle.",
                  }
              ],
          }
          with open("/tmp/meowtxt-index.json", "w") as f:
              json.dump(index_data, f, indent=2)
          with open("/tmp/meowtxt-description.md", "w") as f:
              f.write(
                  "**meowtxt** (dev.sillyangel.meowtxt) is an on-device iMessage Web, PWA / Chrome Isolated Web App (IWA), "
                  "and REST + Server-Sent Events (SSE) API daemon for rootless iOS 15-16 (meowd on port 8737).\n\n"
                  "- **Real-Time Web Client**: Modular ES-module web UI with two-way synced pinned conversations, contact avatars, live typing indicators, tapbacks, inline replies, and bubble/screen effects.\n"
                  "- **Web, Push & Webhook Notifications**: Live alerts when iMessages are received, sent, delivered, or read.\n"
                  "- **Focus / DND & Notify Anyway**: Detects Focus / Do Not Disturb status via StatusKit and supports manual Notify Anyway breakthrough (POST /api/notify).\n"
                  "- **Hardware HEIC & Sticker Conversion**: Automatically transcodes .heic/.heif photos to JPEG and stickers to PNG on-device.\n"
                  "- **Native iOS Settings**: Toggle the server on/off and view or copy your access token in Settings -> meowtxt.\n"
              )
          PY

          if ssh -o ConnectTimeout=10 hackclub-root "true" 2>/dev/null; then
            REMOTE="hackclub-root"
          elif ssh -o ConnectTimeout=10 hel1 "true" 2>/dev/null; then
            REMOTE="hel1"
          else
            REMOTE="hackclub-proxy"
          fi
          echo "Connected via ${REMOTE}"

          scp "$DEB_FILE" "${REMOTE}:/tmp/meowtxt.deb"
          scp layout/usr/share/meowd/sileo/icon.png "${REMOTE}:/tmp/meowtxt-icon.png"
          scp layout/usr/share/meowd/web/sileo-banner.png "${REMOTE}:/tmp/meowtxt-banner.png"
          scp /tmp/meowtxt-index.json "${REMOTE}:/tmp/meowtxt-index.json"
          scp /tmp/meowtxt-description.md "${REMOTE}:/tmp/meowtxt-description.md"

          ssh "$REMOTE" '
            set -euo pipefail
            SUDO=""
            if [ "$(id -u)" -ne 0 ] && sudo -n true 2>/dev/null; then
              SUDO="sudo -n"
            fi
            $SUDO mkdir -p /var/www/sileo/Packages/meowtxt/silica_data
            $SUDO mv /tmp/meowtxt.deb /var/www/sileo/Packages/meowtxt/tweak.deb
            $SUDO mv /tmp/meowtxt-icon.png /var/www/sileo/Packages/meowtxt/silica_data/icon.png
            $SUDO mv /tmp/meowtxt-banner.png /var/www/sileo/Packages/meowtxt/silica_data/banner.png
            $SUDO mv /tmp/meowtxt-index.json /var/www/sileo/Packages/meowtxt/silica_data/index.json
            $SUDO mv /tmp/meowtxt-description.md /var/www/sileo/Packages/meowtxt/silica_data/description.md
            if [ -d /var/www/sileo/venv ]; then
              $SUDO bash -c "cd /var/www/sileo && source venv/bin/activate && python3 index.py"
            fi
            if command -v aptly >/dev/null 2>&1 && [ -f /etc/aptly.conf ]; then
              $SUDO aptly -config=/etc/aptly.conf repo add tweaks /var/www/sileo/Packages/meowtxt/tweak.deb || true
              $SUDO aptly -config=/etc/aptly.conf publish update -skip-signing stable || true
            fi
          '
          echo "Published dev.sillyangel.meowtxt v${VERSION} to https://sileo.sillyangel.dev"
